name: Pipeline Desafio 2026

on:
  push:
    branches:
      - prod
      - development
    tags:
      - 'v*'      

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  DOCKERHUB_USERNAME_V2: rodrigorootrjportifolio

jobs:

  check-env:
    name: Check Environment
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'prod' && 'production' || 'development' }}

    steps:
      - name: Check DockerHub Username
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        run: |
          echo "DOCKERHUB_USERNAME possui conteúdo"

      - name: Check Flask Cache Timeout
        if: ${{ env.FLASK_LOCAL_CACHE_DEFAULT_TIMEOUT != '' }}
        run: |
          echo "FLASK_LOCAL_CACHE_DEFAULT_TIMEOUT possui conteúdo"


  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'prod' && 'production' || 'development' }}

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Environment
        id: env-setup
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/prod" ]]; then
            echo "ENV_NAME=production" >> "$GITHUB_ENV"
            echo "DOCKER_TAG=production" >> "$GITHUB_ENV"
            echo "DOCKER_LATEST=true" >> "$GITHUB_ENV"

          elif [[ "${GITHUB_REF}" == "refs/heads/development" ]]; then
            echo "ENV_NAME=development" >> "$GITHUB_ENV"
            echo "DOCKER_TAG=dev" >> "$GITHUB_ENV"
            echo "DOCKER_LATEST=false" >> "$GITHUB_ENV"
          fi

      - name: Set Release Version
        run: |
            echo "RELEASE=${GITHUB_SHA}" >> "$GITHUB_ENV"



      - name: Show Environment
        run: |
          echo "Environment: ${ENV_NAME}"
          echo "Docker Tag: ${DOCKER_TAG}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ vars.DOCKER_PROJETO }}-${{ env.DOCKER_TAG }}:${{ env.RELEASE }}
          build-args: |
            CODE_ENV=${{ env.ENV_NAME }}
            FLASK_LOCAL_CACHE_DEFAULT_TIMEOUT=${{ vars.FLASK_LOCAL_CACHE_DEFAULT_TIMEOUT }}